<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora on-line</title>
    <link rel="stylesheet" href="style.css">

        <!--Fonte usada -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <section>
            <div id="corpo">
                <div id="visor">0</div>   
                <button class="teclaNum" id="Num1Button">1</button>
                <button class="teclaNum" id="Num2Button">2</button>
                <button class="teclaNum" id="Num3Button">3</button>
                <button class="teclaOpera" id="divisaoBUtton">/</button>
                <button class="teclaNum" id="Num4Button">4</button>
                <button class="teclaNum" id="Num5Button">5</button>
                <button class="teclaNum" id="Num6Button">6</button>
                <button class="teclaOpera" id="multiplicaoButton">*</button>
                <button class="teclaNum" id="Num07Button">7</button>
                <button class="teclaNum" id="Num8Button">8</button>
                <button class="teclaNum" id="Num9Button">9</button>
                <button class="teclaOpera" id="subtracaoButton">-</button>
                <button class="teclaNum" id="Num0Button">0</button>
                <button class="teclaOpera" id="quebraButton">.</button>
                <button id="resultadoButton">=</button>
                <button class="teclaOpera" id="adicaoButton">+</button>
                <button class="teclaOpera" id="CEbutton">CE</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
