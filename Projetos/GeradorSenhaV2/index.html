<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="titulo">Gerador de Senhas on-line</h1>
    </header>

    <main>
        <div class="corpo"> 
            <div class="campoResultado">
                <div id="resultadoSenha"></div>
            </div>
            <button id="gerador">Gerar</button>
        </div>

        <div class="back-config">
            <h3 class="titulo">Seguraça da Senha</h3>
            <input type="radio" id="op1" name="dificult">
            <label for="op1">Facil</label>
            <input type="radio" id="op2" name="dificult">
            <label for="op1">Médio</label>
            <input type="radio" id="op3" name="dificult">
            <label for="op3">Dificil</label>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
